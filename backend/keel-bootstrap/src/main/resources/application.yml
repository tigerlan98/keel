spring:
  application:
    name: keel
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  flyway:
    locations: classpath:db/migration/iam,classpath:db/migration/system,classpath:db/migration/audit,classpath:db/migration/seed
    validate-on-migrate: true
    clean-disabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

keel:
  security:
    cookie-name: KEEL_TOKEN
    cookie-secure: false
    web-idle-timeout: 30m
    web-absolute-timeout: 12h
    app-idle-timeout: 7d
    app-absolute-timeout: 30d
    last-access-write-interval: 5m
