name: verify

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Maven verify
        working-directory: backend
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-admin
          path: backend/keel-bootstrap/target/openapi/admin.json

  contract:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/admin/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: openapi-admin
          path: frontend/admin/openapi
      - name: Replace snapshot
        working-directory: frontend/admin
        run: mv openapi/admin.json openapi/openapi.json
      - name: Install
        working-directory: frontend/admin
        run: pnpm install --frozen-lockfile
      - name: Generate types
        working-directory: frontend/admin
        run: pnpm openapi:generate
      - name: Check contract diff
        run: git diff --exit-code -- frontend/admin/openapi/openapi.json frontend/admin/src/api/generated.ts

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/admin/pnpm-lock.yaml
      - name: Install
        working-directory: frontend/admin
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend/admin
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend/admin
        run: pnpm typecheck
      - name: Build
        working-directory: frontend/admin
        run: pnpm build
      - name: Install Playwright
        working-directory: frontend/admin
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        working-directory: frontend/admin
        run: pnpm test:e2e

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/portal/pnpm-lock.yaml
      - name: Install
        working-directory: frontend/portal
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend/portal
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend/portal
        run: pnpm typecheck
      - name: Build
        working-directory: frontend/portal
        run: pnpm build
